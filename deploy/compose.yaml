name: aegisweave-office
services:
  api:
    image: aegisweave-office:local
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      AEGISWEAVE_ADMIN_TOKEN: ${AEGISWEAVE_ADMIN_TOKEN:?Set a unique admin token}
      AEGISWEAVE_ANALYST_TOKEN: ${AEGISWEAVE_ANALYST_TOKEN:?Set a distinct analyst token}
      AEGISWEAVE_VIEWER_TOKEN: ${AEGISWEAVE_VIEWER_TOKEN:-}
      AEGISWEAVE_PUBLIC_ORIGIN: https://${AEGIS_HOSTNAME:?Set the certificate hostname}
    volumes:
      - api-data:/app/var
      - type: bind
        source: ${AEGIS_MODEL_DIR:?Set an absolute verified model directory}
        target: /models/active
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${AEGIS_CONFIG_FILE:?Set an absolute detection configuration file}
        target: /app/config/site.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    networks: [backend]
  collector:
    image: aegisweave-office:local
    command: [python, -m, aegisweave, collect, --source, /logs/conn*.log, --spool, /app/var/collector.db, --sensor, office-gateway, --url, "http://127.0.0.1:8765"]
    # Same host/network namespace: HTTP stays on loopback; external clients use TLS.
    network_mode: service:api
    depends_on:
      api:
        condition: service_started
    environment:
      AEGISWEAVE_TOKEN: ${AEGISWEAVE_ANALYST_TOKEN:?Set the analyst token}
    volumes:
      - collector-data:/app/var
      - type: bind
        source: ${AEGIS_ZEEK_LOG_DIR:?Set an absolute directory of uncompressed Zeek JSON logs}
        target: /logs
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD, python, -m, aegisweave, collector-health, --spool, /app/var/collector.db]
      interval: 30s
      timeout: 5s
      start_period: 120s
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
  proxy:
    image: caddy:2-alpine
    ports: ["443:443"]
    environment:
      AEGIS_HOSTNAME: ${AEGIS_HOSTNAME:?Set the certificate hostname}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ${AEGIS_CERT_DIR:?Set certificate directory containing fullchain.pem and privkey.pem}
        target: /certs
        read_only: true
        bind:
          create_host_path: false
      - proxy-data:/data
      - proxy-config:/config
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    depends_on: [api]
    networks: [backend]
networks:
  backend:
    internal: true
volumes:
  api-data:
  collector-data:
  proxy-data:
  proxy-config:
