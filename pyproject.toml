[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisweave"
version = "0.1.0"
description = "Evidence-aware machine-learning network intrusion detection research system"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.141.1", "uvicorn==0.52.4", "pydantic==2.13.5",
  "scikit-learn==1.9.1", "numpy==2.5.3", "pandas==3.0.5",
  "scipy==1.18.1", "joblib==1.6.0", "psutil==7.2.2", "httpx==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
aegisweave = "aegisweave.__main__:main"

[tool.setuptools.packages.find]
include = ["aegisweave*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
