services:
  aegisweave:
    build: .
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      AEGISWEAVE_ADMIN_TOKEN: ${AEGISWEAVE_ADMIN_TOKEN:?Set a unique admin token of at least 24 characters}
      AEGISWEAVE_ANALYST_TOKEN: ${AEGISWEAVE_ANALYST_TOKEN:-}
      AEGISWEAVE_VIEWER_TOKEN: ${AEGISWEAVE_VIEWER_TOKEN:-}
    volumes:
      - aegis-data:/app/var
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
volumes:
  aegis-data:
